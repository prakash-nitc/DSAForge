<header class="topbar">

    <div class="timer-wrap">
      <button type="button" class="tool-btn timer-btn" data-timer-btn aria-haspopup="dialog" aria-expanded="false" title="Re-solve timer">
        <svg><use href="#i-timer"/></svg><span class="timer-read" data-timer-read>15:00</span>
      </button>

        <div class="tp-presets" role="radiogroup" aria-label="Cap">
          <button type="button" role="radio" data-min="10" aria-checked="false"><b>10</b><span>Easy re-solve</span></button>
          <button type="button" role="radio" data-min="15" aria-checked="true"><b>15</b><span>Anchor cap</span></button>
          <button type="button" role="radio" data-min="20" aria-checked="false"><b>20</b><span>Medium re-solve</span></button>
          <button type="button" role="radio" data-min="25" aria-checked="false"><b>25</b><span>Daily loop</span></button>
          <button type="button" role="radio" data-min="45" aria-checked="false"><b>45</b><span>The 45-minute rule</span></button>
          <button type="button" role="radio" data-min="90" aria-checked="false"><b>90</b><span>Repair session</span></button>
        </div>
        <p class="tp-big" data-timer-big>15:00</p>
        <div class="tp-actions">
          <button type="button" class="solid-btn" data-timer-start>Start</button>
          <button type="button" class="ghost-btn" data-timer-reset>Reset</button>
        </div>
        <p class="tp-note">Hit the cap, stop, log the failure. <a class="xref" href="#/s5/5-4">§5.4 time bars</a></p>
      </div>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><span data-progress></span></div>
